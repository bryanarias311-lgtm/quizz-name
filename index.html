<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz del Profesor Bryan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="start-screen" class="card start-card">
      <div class="badge">💻 TECNOLOGÍA DIGITAL</div>
      <h1>BIENVENIDO AL QUIZZ DE TU PROFESOR BRYAN ;D</h1>
      <p class="subtitle">Demuestra cuánto sabes y consigue la mejor puntuación. 🔥</p>
      <label for="player-name">Escribe tu nombre</label>
      <input id="player-name" type="text" maxlength="40" placeholder="Tu nombre..." autocomplete="name">
      <button id="start-btn" class="primary">🚀 COMENZAR QUIZZ</button>
      <p id="start-error" class="error"></p>
    </section>

    <section id="quiz-screen" class="card hidden">
      <div class="quiz-top">
        <span id="player-label"></span>
        <span id="progress-label"></span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="question-number" id="question-number"></div>
      <h2 id="question-text"></h2>
      <div id="answers" class="answers"></div>
      <button id="next-btn" class="primary hidden">Siguiente ➜</button>
    </section>

    <section id="result-screen" class="card result-card hidden">
      <div class="result-icon">🏆</div>
      <h1>¡QUIZ COMPLETADO!</h1>
      <p id="result-name"></p>
      <div class="score"><span id="score-value">0</span><small id="score-total">/ 20</small></div>
      <p id="result-percent" class="percent"></p>
      <p id="result-message" class="result-message"></p>
      <button id="restart-btn" class="primary">🔄 VOLVER A INTENTAR</button>
      <p id="save-status" class="save-status"></p>
    </section>
  </main>
  <footer>Quiz creado para Tecnología Digital • Profesor Bryan ;D</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
